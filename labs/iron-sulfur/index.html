<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>الحديد والكبريت: مخلوط أم مركّب؟ | مختبر روافد العلوم</title>
<meta name="description" content="تجربة تفاعلية من منصة روافد العلوم: فصل مخلوط الحديد والكبريت بالمغناطيس، ثم تسخينه لتكوين مركّب كبريتيد الحديد (II).">
<link rel="icon" href="/favicon-192.png">
<link rel="stylesheet" href="../lab.css">
</head>
<body>
<header>
  <div class="brand">منصة روافد العلوم · المختبر الافتراضي</div>
  <h1>الحديد والكبريت: مخلوط أم مركّب؟</h1>
  <p>الكيمياء — الصف التاسع · درس الذرات والجزيئات</p>
</header>
<div class="app">
  <main class="stage" aria-label="مشهد التجربة">
    <svg id="scene" viewBox="0 0 640 420" role="img" aria-label="طبق زجاجي ومغناطيس وأنبوب اختبار فوق موقد بنزن">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#174d6b"/><stop offset="1" stop-color="#0a2a40"/></linearGradient>
        <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5e4d"/><stop offset="1" stop-color="#43342c"/></linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6fbff" stop-opacity=".25"/><stop offset=".5" stop-color="#bfefff" stop-opacity=".08"/><stop offset="1" stop-color="#e6fbff" stop-opacity=".3"/></linearGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7d88"/><stop offset=".5" stop-color="#dfe8ee"/><stop offset="1" stop-color="#66777f"/></linearGradient>
        <radialGradient id="glow"><stop offset="0" stop-color="#fff3b0"/><stop offset=".45" stop-color="#ff9d2e"/><stop offset="1" stop-color="#ff4d00" stop-opacity="0"/></radialGradient>
        <clipPath id="tubeIn"><path d="M455 125 V268 a15 15 0 0 0 30 0 V125 Z"/></clipPath>
      </defs>
      <rect width="640" height="340" fill="url(#wall)"/>
      <rect y="340" width="640" height="80" fill="url(#bench)"/>
      <rect y="336" width="640" height="6" fill="#9b7b66"/>
      <!-- stand + clamp -->
      <rect x="560" y="330" width="70" height="12" rx="3" fill="#2b3a44"/>
      <rect x="590" y="110" width="9" height="225" rx="4" fill="url(#steel)"/>
      <rect x="484" y="160" width="110" height="8" rx="4" fill="url(#steel)"/>
      <rect x="478" y="153" width="14" height="22" rx="3" fill="#8a9aa3"/>
      <!-- burner -->
      <g id="burner">
        <rect x="446" y="330" width="48" height="10" rx="3" fill="#2b3a44"/>
        <rect x="459" y="292" width="22" height="40" rx="3" fill="url(#steel)"/>
        <g id="flame" opacity="0">
          <path d="M470 290 C452 270 462 250 470 232 C478 250 488 270 470 290Z" fill="#3b82f6" opacity=".85"/>
          <path d="M470 288 C462 275 465 262 470 252 C475 262 478 275 470 288Z" fill="#a5f3fc"/>
        </g>
      </g>
      <!-- test tube -->
      <g id="tube">
        <g clip-path="url(#tubeIn)">
          <rect id="tubeMix" x="455" y="283" width="30" height="0" fill="#a39a62"/>
          <g id="tubeSpeck"></g>
          <circle id="tubeGlow" cx="470" cy="262" r="40" fill="url(#glow)" opacity="0"/>
        </g>
        <path d="M455 118 V268 a15 15 0 0 0 30 0 V118" fill="url(#glass)" stroke="#d6f6ff" stroke-opacity=".85" stroke-width="3"/>
        <rect x="451" y="114" width="38" height="6" rx="3" fill="#d6f6ff" opacity=".8"/>
      </g>
      <!-- dish -->
      <ellipse cx="210" cy="322" rx="128" ry="16" fill="#00000040"/>
      <path d="M86 300 Q210 352 334 300" fill="url(#glass)" stroke="#d6f6ff" stroke-opacity=".8" stroke-width="3"/>
      <g id="dishParts"></g>
      <!-- magnet -->
      <g id="magnet" transform="translate(720,60)">
        <path d="M-40 0 V-62 A40 40 0 0 1 40 -62 V0 H18 V-62 A18 18 0 0 0 -18 -62 V0 Z" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
        <rect x="-40" y="-14" width="22" height="14" fill="url(#steel)"/>
        <rect x="18" y="-14" width="22" height="14" fill="url(#steel)"/>
        <text x="-29" y="-30" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">N</text>
        <text x="29" y="-30" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">S</text>
        <g id="stuck"></g>
      </g>
      <g font-size="15" fill="#cfe7f2" text-anchor="middle" font-family="Tahoma,Arial">
        <text x="210" y="384">طبق زجاجي</text>
        <text x="470" y="384">أنبوب اختبار وموقد</text>
      </g>
      <text id="caption" x="320" y="40" font-size="18" fill="#fde68a" text-anchor="middle" font-weight="700" font-family="Tahoma,Arial"></text>
    </svg>
  </main>
  <aside class="panel">
    <h2>خطوات التجربة</h2>
    <ol class="steps" id="steps"></ol>
    <div class="actions"><button class="btn primary" id="act"></button><button class="btn" id="reset">↻ إعادة</button></div>
    <div class="obs" id="obs" aria-live="polite"></div>
    <div class="warn">⚠️ تسخين الحديد مع الكبريت يُنفَّذ في المختبر الحقيقي من قِبل المعلم فقط، مع النظارات الواقية وتهوية جيدة، لأنه قد يتصاعد غاز ثاني أكسيد الكبريت.</div>
  </aside>
</div>
<section class="quiz hide" id="quiz"></section>
<script src="../lab.js"></script>
<script src="app.js"></script>
</body>
</html>
