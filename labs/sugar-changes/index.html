<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>السكّر: تغيّر فيزيائي أم كيميائي؟ | مختبر روافد العلوم</title>
<meta name="description" content="تجربة تفاعلية من منصة روافد العلوم: إذابة السكر في الماء واستعادته بالتبخير، ثم تسخين السكر الجاف بقوة، للمقارنة بين التغيّر الفيزيائي والكيميائي.">
<link rel="icon" href="/favicon-192.png">
<link rel="stylesheet" href="../lab.css">
</head>
<body>
<header>
  <div class="brand">منصة روافد العلوم · المختبر الافتراضي</div>
  <h1>السكّر: تغيّر فيزيائي أم كيميائي؟</h1>
  <p>الكيمياء — الصف التاسع · درس الذرات والجزيئات</p>
</header>
<div class="app">
  <main class="stage" aria-label="مشهد التجربة">
    <svg id="scene" viewBox="0 0 640 420" role="img" aria-label="كأس ماء فوق موقد، وجفنة فيها سكر فوق موقد آخر">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#174d6b"/><stop offset="1" stop-color="#0a2a40"/></linearGradient>
        <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5e4d"/><stop offset="1" stop-color="#43342c"/></linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6fbff" stop-opacity=".25"/><stop offset=".5" stop-color="#bfefff" stop-opacity=".08"/><stop offset="1" stop-color="#e6fbff" stop-opacity=".3"/></linearGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7d88"/><stop offset=".5" stop-color="#dfe8ee"/><stop offset="1" stop-color="#66777f"/></linearGradient>
        <linearGradient id="porc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#b8c2cc"/></linearGradient>
        <clipPath id="beakIn"><rect x="138" y="160" width="84" height="106" rx="8"/></clipPath>
      </defs>
      <rect width="640" height="340" fill="url(#wall)"/>
      <rect y="340" width="640" height="80" fill="url(#bench)"/>
      <rect y="336" width="640" height="6" fill="#9b7b66"/>
      <!-- station 1: tripod + burner + beaker -->
      <g stroke="#55656f" stroke-width="5" stroke-linecap="round"><line x1="140" y1="272" x2="122" y2="338"/><line x1="220" y1="272" x2="238" y2="338"/></g>
      <rect x="120" y="268" width="120" height="7" rx="3" fill="#6b7a84"/>
      <rect x="156" y="330" width="48" height="10" rx="3" fill="#2b3a44"/>
      <rect x="169" y="300" width="22" height="32" rx="3" fill="url(#steel)"/>
      <g id="flame1" opacity="0"><path d="M180 298 C166 284 172 272 180 258 C188 272 194 284 180 298Z" fill="#3b82f6" opacity=".85"/><path d="M180 296 C174 287 176 278 180 271 C184 278 186 287 180 296Z" fill="#a5f3fc"/></g>
      <g clip-path="url(#beakIn)">
        <rect id="water" x="138" y="200" width="84" height="70" fill="#7dd3fc" opacity=".35"/>
        <g id="crystals"></g>
        <g id="residue"></g>
      </g>
      <path d="M134 158 V256 a12 12 0 0 0 12 12 H214 a12 12 0 0 0 12 -12 V158" fill="url(#glass)" stroke="#d6f6ff" stroke-opacity=".85" stroke-width="3"/>
      <g id="rod" opacity="0"><line x1="170" y1="130" x2="186" y2="262" stroke="#e0f7ff" stroke-width="5" stroke-linecap="round" stroke-opacity=".85"/></g>
      <g id="steam"></g>
      <!-- station 2: tripod + burner + crucible -->
      <g stroke="#55656f" stroke-width="5" stroke-linecap="round"><line x1="430" y1="272" x2="412" y2="338"/><line x1="510" y1="272" x2="528" y2="338"/></g>
      <rect x="410" y="268" width="120" height="7" rx="3" fill="#6b7a84"/>
      <rect x="446" y="330" width="48" height="10" rx="3" fill="#2b3a44"/>
      <rect x="459" y="300" width="22" height="32" rx="3" fill="url(#steel)"/>
      <g id="flame2" opacity="0"><path d="M470 298 C452 280 462 266 470 250 C478 266 488 280 470 298Z" fill="#3b82f6" opacity=".85"/><path d="M470 296 C463 285 466 274 470 266 C474 274 477 285 470 296Z" fill="#a5f3fc"/></g>
      <path d="M424 236 H516 L506 266 H434 Z" fill="url(#porc)" stroke="#94a3b8" stroke-width="2"/>
      <ellipse id="sugar2" cx="470" cy="238" rx="40" ry="8" fill="#ffffff"/>
      <g id="melt"></g>
      <g id="smoke"></g>
      <g font-size="15" fill="#cfe7f2" text-anchor="middle" font-family="Tahoma,Arial">
        <text x="180" y="384">سكّر + ماء</text>
        <text x="470" y="384">سكّر جاف في جفنة</text>
      </g>
      <text id="caption" x="320" y="48" font-size="18" fill="#fde68a" text-anchor="middle" font-weight="700" font-family="Tahoma,Arial"></text>
    </svg>
  </main>
  <aside class="panel">
    <h2>خطوات التجربة</h2>
    <ol class="steps" id="steps"></ol>
    <div class="actions"><button class="btn primary" id="act"></button><button class="btn" id="reset">↻ إعادة</button></div>
    <div class="obs" id="obs" aria-live="polite"></div>
    <div class="warn">⚠️ لا تتذوّق أي مادة في المختبر. تسخين السكر بقوة يُنفَّذ من قِبل المعلم مع تهوية جيدة، والسكّر المنصهر شديد السخونة ويسبب حروقًا.</div>
  </aside>
</div>
<section class="quiz hide" id="quiz"></section>
<script src="../lab.js"></script>
<script src="app.js"></script>
</body>
</html>
