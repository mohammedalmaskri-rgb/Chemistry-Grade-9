<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>اختبار اللهب | مختبر روافد العلوم</title>
<meta name="description" content="تجربة تفاعلية من منصة روافد العلوم: اختبار اللهب لأملاح الليثيوم والصوديوم والبوتاسيوم والكالسيوم والنحاس، وتفسير الألوان بانتقال الإلكترونات بين مستويات الطاقة.">
<link rel="icon" href="/favicon-192.png">
<link rel="stylesheet" href="../lab.css">
<style>
.res{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px}
.res td{padding:4px 6px;border-bottom:1px solid #1d435a}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-left:6px;border:1px solid #fff6}
</style>
</head>
<body>
<header>
  <div class="brand">منصة روافد العلوم · المختبر الافتراضي</div>
  <h1>اختبار اللهب</h1>
  <p>الكيمياء — الصف التاسع · درس ترتيب الإلكترونات في الذرّات</p>
</header>
<div class="app">
  <main class="stage" aria-label="مشهد التجربة">
    <svg id="scene" viewBox="0 0 640 420" role="img" aria-label="موقد بنزن وعيّنات أملاح وسلك اختبار">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f3550"/><stop offset="1" stop-color="#071d2e"/></linearGradient>
        <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5e4d"/><stop offset="1" stop-color="#43342c"/></linearGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7d88"/><stop offset=".5" stop-color="#dfe8ee"/><stop offset="1" stop-color="#66777f"/></linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6fbff" stop-opacity=".25"/><stop offset=".5" stop-color="#bfefff" stop-opacity=".08"/><stop offset="1" stop-color="#e6fbff" stop-opacity=".3"/></linearGradient>
        <radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <rect width="640" height="340" fill="url(#wall)"/>
      <rect y="340" width="640" height="80" fill="url(#bench)"/>
      <rect y="336" width="640" height="6" fill="#9b7b66"/>
      <!-- burner -->
      <rect x="128" y="330" width="64" height="12" rx="3" fill="#2b3a44"/>
      <rect x="148" y="270" width="24" height="62" rx="3" fill="url(#steel)"/>
      <rect x="144" y="306" width="32" height="8" rx="2" fill="#9aa9b1"/>
      <circle id="glowC" cx="160" cy="210" r="70" fill="#3b82f6" opacity=".12" filter="url(#blur)"/>
      <path id="flameOut" d="M160 270 C122 238 138 196 160 130 C182 196 198 238 160 270Z" fill="#3b82f6" opacity=".55"/>
      <path d="M160 268 C148 252 150 234 160 212 C170 234 172 252 160 268Z" fill="#a5f3fc" opacity=".85"/>
      <!-- acid beaker -->
      <g transform="translate(588,0)">
        <path d="M-24 278 V326 a8 8 0 0 0 8 8 H16 a8 8 0 0 0 8 -8 V278" fill="url(#glass)" stroke="#d6f6ff" stroke-opacity=".8" stroke-width="2.5"/>
        <rect x="-21" y="298" width="42" height="34" rx="6" fill="#fef9c3" opacity=".35"/>
        <text y="360" font-size="12" fill="#cfe7f2" text-anchor="middle" font-family="Tahoma,Arial">حمض</text>
        <text y="374" font-size="12" fill="#cfe7f2" text-anchor="middle" font-family="Tahoma,Arial" direction="ltr">HCl</text>
      </g>
      <g id="samples" font-family="Tahoma,Arial"></g>
      <!-- wire -->
      <g id="wire" transform="translate(470,180)">
        <line x1="0" y1="0" x2="120" y2="-34" stroke="#cbd5e1" stroke-width="2.4"/>
        <rect x="112" y="-44" width="70" height="14" rx="6" fill="#7c4a2a" transform="rotate(-16 112 -37)"/>
        <circle cx="0" cy="0" r="6" fill="none" stroke="#e2e8f0" stroke-width="2.4"/>
        <circle id="loopSalt" cx="0" cy="0" r="4" fill="#fff" opacity="0"/>
      </g>
      <!-- energy levels -->
      <g id="levels" transform="translate(420,20)" opacity="0" font-family="Tahoma,Arial">
        <rect width="202" height="140" rx="14" fill="#04121dcc" stroke="#2f6078"/>
        <text x="101" y="20" font-size="12.5" fill="#9fc3d3" text-anchor="middle">انتقال الإلكترون بين المستويات</text>
        <g stroke="#7dd3fc" stroke-width="2"><line x1="70" y1="118" x2="190" y2="118"/><line x1="70" y1="82" x2="190" y2="82"/><line x1="70" y1="46" x2="190" y2="46"/></g>
        <g font-size="11" fill="#cfe7f2" text-anchor="start"><text x="64" y="122">المستوى 1</text><text x="64" y="86">المستوى 2</text><text x="64" y="50">المستوى 3</text></g>
        <path id="photon" d="" fill="none" stroke="#facc15" stroke-width="2.5" opacity="0"/>
        <circle id="elec" cx="110" cy="118" r="7" fill="#38bdf8" stroke="#e0f2fe"/>
      </g>
      <text id="caption" x="300" y="48" font-size="18" fill="#fde68a" text-anchor="middle" font-weight="700" font-family="Tahoma,Arial"></text>
    </svg>
  </main>
  <aside class="panel">
    <h2>العيّنة</h2>
    <div class="picks" id="picks"></div>
    <h2>خطوات التجربة</h2>
    <ol class="steps" id="steps"></ol>
    <div class="actions"><button class="btn primary" id="act"></button><button class="btn" id="reset">↻ إعادة</button></div>
    <div class="obs" id="obs" aria-live="polite"></div>
    <div class="warn">⚠️ في المختبر الحقيقي يُجري المعلم اختبار اللهب كعرض عملي، مع النظارات الواقية، ويُنظَّف السلك بالحمض المخفّف بين كل عيّنة وأخرى.</div>
  </aside>
</div>
<section class="quiz hide" id="quiz"></section>
<script src="../lab.js"></script>
<script src="app.js"></script>
</body>
</html>
